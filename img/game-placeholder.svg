<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="game-placeholder-title game-placeholder-desc">
  <title id="game-placeholder-title">تصویر جایگزین بازی</title>
  <desc id="game-placeholder-desc">تصویرسازی انتزاعی از یک دنیای مکعبی بنفش</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1552"/>
      <stop offset=".52" stop-color="#1a1127"/>
      <stop offset="1" stop-color="#0e0d0d"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#7c3aed" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#ddd6fe" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cube-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="cube-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>

    <linearGradient id="cube-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>

    <g id="cube">
      <path d="M0-46 80 0 0 46-80 0Z" fill="url(#cube-top)"/>
      <path d="M-80 0 0 46 0 100-80 54Z" fill="url(#cube-left)"/>
      <path d="M80 0 0 46 0 100 80 54Z" fill="url(#cube-right)"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="900" cy="220" rx="460" ry="380" fill="url(#glow)"/>
  <circle cx="900" cy="190" r="150" fill="url(#moon)"/>
  <circle cx="900" cy="186" r="46" fill="#ede9fe" opacity=".55"/>
  <circle cx="884" cy="172" r="12" fill="#c4b5fd" opacity=".35"/>
  <circle cx="916" cy="202" r="8" fill="#c4b5fd" opacity=".28"/>

  <g fill="#e9d5ff">
    <rect x="118" y="122" width="4" height="4" opacity=".8"/>
    <rect x="210" y="208" width="3" height="3" opacity=".5"/>
    <rect x="320" y="96" width="3" height="3" opacity=".65"/>
    <rect x="430" y="170" width="4" height="4" opacity=".45"/>
    <rect x="520" y="118" width="3" height="3" opacity=".7"/>
    <rect x="640" y="220" width="3" height="3" opacity=".4"/>
    <rect x="730" y="92" width="4" height="4" opacity=".6"/>
    <rect x="1010" y="120" width="3" height="3" opacity=".55"/>
    <rect x="1100" y="230" width="4" height="4" opacity=".45"/>
    <rect x="1060" y="330" width="3" height="3" opacity=".35"/>
    <rect x="250" y="330" width="3" height="3" opacity=".35"/>
    <rect x="470" y="280" width="3" height="3" opacity=".3"/>
  </g>

  <g stroke="#e9d5ff" stroke-width="2" opacity=".55">
    <path d="M300 140v14M293 147h14"/>
    <path d="M760 260v10M755 265h10"/>
  </g>

  <path d="M0 520 140 400 270 500 410 370 570 515 720 410 870 520 1010 415 1120 500 1200 450V800H0Z" fill="#1c1230"/>
  <path d="M0 610 170 500 330 610 500 480 680 615 850 505 1040 610 1200 520V800H0Z" fill="#171024"/>
  <ellipse cx="600" cy="640" rx="700" ry="130" fill="#7528cc" opacity=".12"/>

  <g opacity=".55">
    <use href="#cube" transform="translate(290 285) scale(.55)"/>
    <use href="#cube" transform="translate(850 330) scale(.32)"/>
    <use href="#cube" transform="translate(1040 200) scale(.22)"/>
  </g>

  <g opacity=".95">
    <use href="#cube" transform="translate(170 612) scale(.9)"/>
    <use href="#cube" transform="translate(340 664) scale(1.15)"/>
    <use href="#cube" transform="translate(545 618) scale(.8)"/>
    <use href="#cube" transform="translate(720 668) scale(1.05)"/>
    <use href="#cube" transform="translate(910 620) scale(.95)"/>
    <use href="#cube" transform="translate(1080 662) scale(1.2)"/>
  </g>
</svg>
